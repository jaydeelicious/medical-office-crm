name: Medical Office CRM CI

on: 
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "CITestOnly_2026_StrongPassword!"
        ports: 
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CITestOnly_2026_StrongPassword!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 40s
    
    env:
      MEDICALOFFICE_TEST_SQL_CONNECTION: "Server=localhost,1433;User Id=sa;Password=CITestOnly_2026_StrongPassword!;Encrypt=True;TrustServerCertificate=True;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with: 
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore medical-office-crm.slnx

      - name: Build solution
        run: dotnet build medical-office-crm.slnx --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test medical-office-crm.slnx --no-build --configuration Release

  frontend:
    name: Frontend _ Test, Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: medical-office-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        
      - name: Setup Node.jobs
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: medical-office-web/package-lock.json

      - name: Install dependencies
        run: npm CI

      - name: Run Angular tests
        run: npm test -- --watch=false

      - name: Run Angular lint
        run: npm run lint

      - name: Build Angular application
        run: npm run build -- --configuration production
