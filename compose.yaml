
name: medicaloffice

services:
  medicaloffice-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}

    ports:
      - "127.0.0.1:14333:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -Nm -C
          -Q "SELECT 1"
          -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    restart: unless-stopped

  medicaloffice-api:
    build:
      context: .
      dockerfile: MedicalOffice.Api/Dockerfile

    image: medicaloffice-api:compose

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: >-
        Server=medicaloffice-sql,1433;
        Database=MedicalOfficeDockerDb;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD};
        Encrypt=True;
        TrustServerCertificate=True

      OpenIddict__Clients__SeedOnStartup: "true"
      DevelopmentTestUser__SeedOnStartup: "false"

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      medicaloffice-sql:
        condition: service_healthy

    restart: unless-stopped

  medicaloffice-web:
    build:
      context: ./medical-office-web
      dockerfile: Dockerfile

    image: medicaloffice-web:compose

    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8443:8443"
      
    volumes:
      - ./docker-local/certs:/etc/nginx/certs:ro

    depends_on:
      medicaloffice-api:
        condition: service_started

    restart: unless-stopped

volumes:
  sqlserver-data:
