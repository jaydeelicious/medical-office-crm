
name: medicaloffice

services:
  medicaloffice-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}

    ports:
      - "127.0.0.1:14333:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -Nm -C
          -Q "SELECT 1"
          -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    restart: unless-stopped

  medicaloffice-api:
    build:
      context: .
      dockerfile: MedicalOffice.Api/Dockerfile

    image: medicaloffice-api:compose

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: >-
        Server=medicaloffice-sql,1433;
        Database=MedicalOfficeDockerDb;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD};
        Encrypt=True;
        TrustServerCertificate=True

      OpenIddict__Clients__SeedOnStartup: "true"
      DevelopmentTestUser__SeedOnStartup: "true"
      DevelopmentTestUser__Password: ${DEVELOPMENT_TEST_USER_PASSWORD:?Set DEVELOPMENT_TEST_USER_PASSWORD in .env}
      
      ReverseProxy__KnownProxy: "172.30.77.10"
      
      OpenIddict__Clients__Angular__RedirectUri: "https://localhost:8443/auth/callback"
      OpenIddict__Clients__Angular__PostLogoutRedirectUri: "https://localhost:8443/"
      OpenIddict__Issuer: "https://localhost:8443/"

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      medicaloffice-sql:
        condition: service_healthy

    restart: unless-stopped

  medicaloffice-web:
    build:
      context: ./medical-office-web
      dockerfile: Dockerfile

    image: medicaloffice-web:compose

    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8443:8443"
      
    volumes:
      - ./docker-local/certs:/etc/nginx/certs:ro
      - ./docker-local/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro

    depends_on:
      medicaloffice-api:
        condition: service_started
    
    networks:
      default:
        ipv4_address: 172.30.77.10

    restart: unless-stopped

volumes:
  sqlserver-data:
  
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24
