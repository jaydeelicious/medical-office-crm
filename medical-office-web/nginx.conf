
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never cache the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache fingerprinted static assets
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy will be configured in the integration step.
    # Prevent missing API endpoints returning index.html.
    location ^~ /api/ {
        return 503;
    }

    # Angular client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
