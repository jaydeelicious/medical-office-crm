
server {
    # HTTPS listener for local Docker development
    listen 8443 ssl;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Runtime configuration must not be cached
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }


    # Never cache the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache fingerprinted static assets
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    
    # Proxy API requests to ASP.NET Core
    location ^~ /api/ {
        proxy_pass http://medicaloffice-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # OpenID Connect endpoints
    location ^~ /connect/ {
        proxy_pass http://medicaloffice-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ASP.NET Core Identity endpoints
    location ^~ /account/ {
        proxy_pass http://medicaloffice-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenID Connect discovery and key endpoints
    location ^~ /.well-known/ {
        proxy_pass http://medicaloffice-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Angular client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    server_name _;

    return 308 https://localhost:8443$request_uri;
}
