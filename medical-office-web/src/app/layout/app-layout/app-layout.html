
<div class="app-layout">
  <aside
    id="main-sidebar"
    class="sidebar"
    [class.sidebar-open]="menuOpen()"
  >
    <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
      <svg lucideHeartPulse aria-hidden="true"></svg>
      <span>MedicalOffice</span>
    </a>

    <nav aria-label="Main navigation">
      @for (item of navigation; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          @switch (item.path) {
            @case ('/dashboard') {
              <svg lucideLayoutDashboard aria-hidden="true"></svg>
            }
            @case ('/patients') {
              <svg lucideUsersRound aria-hidden="true"></svg>
            }
            @case ('/doctors') {
              <svg lucideStethoscope aria-hidden="true"></svg>
            }
            @case ('/appointments') {
              <svg lucideCalendarDays aria-hidden="true"></svg>
            }
          }

          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  @if (menuOpen()) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close navigation menu"
      (click)="closeMenu()"
    ></button>
  }

  <div class="main-container">
    <header class="app-header">
      <div class="header-left">
        <button
          class="menu-toggle"
          type="button"
          aria-controls="main-sidebar"
          [attr.aria-expanded]="menuOpen()"
          aria-label="Toggle navigation menu"
          (click)="toggleMenu()"
        >
          <svg lucideMenu aria-hidden="true"></svg>
        </button>

        <span class="page-title">{{ pageTitle() }}</span>
      </div>

      <div class="header-right">
        <svg lucideCircleUserRound aria-hidden="true"></svg>
      </div>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
