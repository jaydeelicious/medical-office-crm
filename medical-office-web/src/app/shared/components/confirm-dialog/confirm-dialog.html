<dialog #dialog class="confirm-dialog" [attr.aria-label]="title()" [attr.aria-describedby]="messageId"
    (cancel)="onNativeCancel($event)">
    <h2>{{ title() }}</h2>

    <p [id]="messageId">
        {{ message() }}
    </p>


    <div class="dialog-actions">
        <button type="button" class="cancel-button" autofocus [disabled]="isProcessing()" (click)="onCancel()">
            Cancel
        </button>

        <button type="button" class="confirm-button" [disabled]="isProcessing()" (click)="onConfirm()">
            {{ isProcessing() ? 'Processing...' : confirmLabel() }}
        </button>
    </div>

</dialog>
