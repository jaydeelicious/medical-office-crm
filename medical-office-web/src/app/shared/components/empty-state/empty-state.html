<div class="empty-state">
  <div class="empty-state-icon" aria-hidden="true">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="4" y="4" width="16" height="16" rx="3" />
      <path d="M8 12h8" />
    </svg>
  </div>

  <h2>{{ title() }}</h2>

  @if (description(); as text) {
    <p>{{ text }}</p>
  }

  <div class="empty-state-actions">
    <ng-content />
  </div>
</div>
