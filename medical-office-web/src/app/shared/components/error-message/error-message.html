<div class="error-message" role="alert">
  <svg
    class="error-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="10" />
    <path d="M12 8v4" />
    <path d="M12 16h.01" />
  </svg>

  <div class="error-content">
    <p>{{ message() }}</p>

    @if (retryable()) {
      <button type="button" (click)="onRetry()">
        Retry
      </button>
    }
  </div>
</div>
